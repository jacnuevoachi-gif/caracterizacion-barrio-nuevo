<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel · JAC Nuevo Achí</title><link rel="stylesheet" href="/static/style.css"></head><body><header><b>JAC NUEVO ACHÍ</b><nav><a href="/dashboard">Panel</a><a href="/descargar">Descargar Excel</a><a href="/logout">Salir</a></nav></header><main><section class="hero"><small>GESTIÓN COMUNITARIA</small><h1>Caracterización de hogares</h1><p>Consulta y actualiza la información del Barrio Nuevo Achí.</p></section><section class="stats"><div><b>{{total}}</b><span>Registros</span></div><div><b>{{complete}}</b><span>Completos / validados</span></div><div><b>{{pending}}</b><span>Pendientes</span></div><div><b>706</b><span>Meta</span></div></section><section class="card"><div class="search"><input id="q" placeholder="Código, nombre, documento o teléfono"><button onclick="buscar()">Buscar</button></div><div id="r"></div></section></main><script>async function buscar(){const q=document.getElementById('q').value;const d=await(await fetch('/api/hogares?q='+encodeURIComponent(q))).json();document.getElementById('r').innerHTML=d.map(x=>`<a class="item" href="/hogar/${encodeURIComponent(x['Código hogar'])}"><b>${x['Código hogar']||''}</b><span>${x['Nombre jefe del hogar']||'Sin nombre'}</span><em>${x['Estado de caracterización']||'Pendiente'}</em></a>`).join('')||'<p class="empty">No hay resultados.</p>'}buscar()</script></body></html>
